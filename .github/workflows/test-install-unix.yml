name: Test install.sh

on:
  pull_request:
    paths: [install.sh]

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Run install script
        run: bash install.sh

      - name: Verify CLI works
        run: workos --version
